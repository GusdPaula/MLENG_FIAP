[tool.poetry]
name = "fase-3-tech-challenge"
version = "0.1.0"
description = "Pipeline de Deploy de Modelo em Produção com CI/CD, Monitoramento e Otimização de Latência (Tech Challenge Fase 3 - FIAP)"
authors = ["Tech Challenge Group"]
readme = "README.md"
packages = [{include = "treino_modelo"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26.0,<3.0.0"
pandas = ">=2.2.0"
scikit-learn = ">=1.4.0"
kagglehub = ">=0.2.0"
joblib = ">=1.4.0"
onnxruntime = ">=1.18.0"
skl2onnx = ">=1.17.0"
apache-airflow = {version = ">=2.8.0", optional = true}

# Dependências para a API (Etapas 1 e 3)
fastapi = {version = ">=0.110.0", optional = true}
uvicorn = {version = ">=0.28.0", optional = true}
prometheus-client = {version = ">=0.20.0", optional = true}

[tool.poetry.extras]
airflow = ["apache-airflow"]
api = ["fastapi", "uvicorn", "prometheus-client"]
full = ["apache-airflow", "fastapi", "uvicorn", "prometheus-client"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
hypothesis = ">=6.100.0"
ruff = ">=0.4.0"

[tool.poetry.group.notebooks.dependencies]
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"
nltk = ">=3.8.0"
ipykernel = ">=6.29.0"

[tool.poetry.scripts]
train-pipeline = "treino_modelo.pipeline:run_pipeline"
benchmark = "treino_modelo.optimize.benchmark:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["treino_modelo/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "artifacts",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (organização de imports)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line-too-long (delega para o formatador)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
