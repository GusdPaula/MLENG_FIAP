[tool.poetry]
name = "credit-scoring"
version = "0.1.0"
description = "Tech Challenge Fase 4 — Observabilidade, Drift, Qualidade e Governança em Produção"
authors = ["Grupo FIAP MLENG"]
packages = [{ include = "credit_scoring" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.0,<3.0"
numpy = ">=1.26,<3.0"
scikit-learn = ">=1.3,<2.0"
xgboost = ">=2.0,<3.0"
pandera = ">=0.18,<1.0"
evidently = ">=0.4,<1.0"
mlflow = ">=2.10,<3.0"
matplotlib = ">=3.8,<4.0"
seaborn = ">=0.13,<1.0"
joblib = ">=1.3,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<6.0"
ruff = ">=0.4,<1.0"

[tool.poetry.scripts]
pipeline = "credit_scoring.pipeline:main"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
