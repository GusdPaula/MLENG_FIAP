[project]
name = "fase-4"
version = "0.1.0"
description = "ML engineering project for default prediction"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "ipykernel",
    "matplotlib",
    "scikit-learn",
    "openpyxl",
    "seaborn",
    "pandera",
    "pytest",
    "ruff",
    "evidently>=0.7.23",
    "mlflow>=3.17.2",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]

# Coverage gate (>= 90%) applies to the Stage 3 observability code only.
# Run with: uv run pytest --cov --cov-report=term-missing
[tool.coverage.run]
source = ["src/default_pred"]
# Stage 1/2 code and shared glue are out of the gate; only new Stage 3 code counts.
omit = [
    "src/default_pred/config.py",
    "src/default_pred/data/*",
    "src/default_pred/features/*",
    "src/default_pred/models/*",
    "src/default_pred/utils/*",
    "src/default_pred/pipelines/pipeline_train.py",
    "src/default_pred/pipelines/pipeline_predict.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
