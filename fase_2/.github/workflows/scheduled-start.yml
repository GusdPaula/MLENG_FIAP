name: Scheduled Start (Morning)

on:
  schedule:
    # Start resources at 8 AM UTC (4 AM EST) on weekdays
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  start-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_API }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_API }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Start all resources
        run: python scripts/start_resources.py

      - name: Create summary
        run: |
          echo "## Resources Started :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- MLflow EC2: Started" >> $GITHUB_STEP_SUMMARY
          echo "- Grafana EC2: Started" >> $GITHUB_STEP_SUMMARY
          echo "- Prometheus EC2: Started" >> $GITHUB_STEP_SUMMARY
          echo "- ECS Service: Started" >> $GITHUB_STEP_SUMMARY
          echo "- RDS: Kept running" >> $GITHUB_STEP_SUMMARY
