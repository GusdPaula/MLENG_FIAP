name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Infrastructure target to destroy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mlflow
          - s3
      confirmation:
        description: 'Type DESTROY to confirm infrastructure deletion'
        required: true
        type: string

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Confirmation Input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DESTROY" ]; then
            echo "Error: Confirmation input must be exactly 'DESTROY' to proceed with infrastructure destruction."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Destroy MLflow
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'mlflow' }}
        run: |
          echo "Initiating destruction of MLflow Infrastructure..."
          cd fase_2/infra/mlflow
          terraform init
          terraform destroy -auto-approve -input=false -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" -var="use_custom_domain=true"

      - name: Terraform Destroy S3 Remote (DVC)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 's3' }}
        run: |
          echo "Initiating destruction of S3 / DVC Infrastructure..."
          cd fase_2/infra/s3
          terraform init
          terraform destroy -auto-approve -input=false
